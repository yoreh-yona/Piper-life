name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: App icon and camera permission
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          cp -r android-icons/* $RES/
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Copy the app into the project
        run: npx cap sync android

      - name: Use the project's signing key (so updates install over the old version)
        run: |
          mkdir -p ~/.android
          cp android-signing/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk piper-life.apk

      - uses: actions/upload-artifact@v4
        with:
          name: piper-life-apk
          path: piper-life.apk

      - name: Publish as a release (easy download from the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: החיים של פייפר — גרסה 1.${{ github.run_number }}
          body: להתקנה באנדרואיד הורידו את piper-life.apk ופתחו אותו בטלפון.
          files: piper-life.apk
          make_latest: true
